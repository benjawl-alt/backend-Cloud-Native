
name: pedidos360

services:

  # =========================
  # MONGODB
  # =========================
  mongodb:
    image: mongo:latest
    container_name: pedidos360-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

  # =========================
  # RABBITMQ - NODO 1
  # =========================
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-secreta}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:25682:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq1_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # =========================
  # RABBITMQ - NODO 2
  # =========================
  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-secreta}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:25683:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # =========================
  # POLITICA HA RABBITMQ
  # =========================
  rabbitmq-policy:
    image: curlimages/curl:8.8.0
    container_name: pedidos360-rabbitmq-policy
    restart: "no"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e

      until curl -fsS \
        -u "${RABBITMQ_USER:-pedidos360}:${RABBITMQ_PASSWORD:-pedidos360}" \
        http://rabbitmq1:15672/api/overview >/dev/null; do
        echo "Esperando RabbitMQ..."
        sleep 5
      done

      curl -fsS \
        -u "${RABBITMQ_USER:-pedidos360}:${RABBITMQ_PASSWORD:-pedidos360}" \
        -X PUT \
        -H "content-type: application/json" \
        http://rabbitmq1:15672/api/policies/%2F/ha-all \
        -d '{"pattern":".*","definition":{"ha-mode":"all","ha-sync-mode":"automatic"},"apply-to":"queues"}'

      echo "Politica HA aplicada correctamente"

  # =========================
  # ZOOKEEPER
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pedidos360-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  
  # =========================
  # KAFKA BROKER
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pedidos360-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s


    # =========================
  # KAFKA UI
  # =========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # =========================
  # MS KAFKA ADMIN
  # =========================
  ms-kafka-admin:
    build: ./ms-kafka-admin
    container_name: pedidos360-ms-kafka-admin
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      KAFKA_ADMIN_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ADMIN_TIMEOUT_SECONDS: "30"
    depends_on:
      kafka:
        condition: service_healthy

  # =========================
  # MS ORDER
  # =========================
  ms-order:
    build: ./ms-order
    container_name: pedidos360-ms-order
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/pedidos360_order
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/pedidos360_order

      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}

      PRODUCT_SERVICE_URL: http://ms-product:8082

      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REPLICAS: "1"
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      ms-product:
        condition: service_started

   # =========================
  # MS PRODUCT
  # =========================
  ms-product:
    build: ./ms-product
    container_name: pedidos360-ms-product
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/pedidos360_product
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/pedidos360_product

      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}

      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      APP_STOCK_LOW_THRESHOLD: "97"
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
      kafka:
        condition: service_healthy


  # =========================
  # MS RABBIT ADMIN
  # =========================
  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    container_name: pedidos360-ms-rabbit-admin
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq1:15672
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy

# =========================
# VOLUMENES PERSISTENTES
# =========================
volumes:
  mongo_data:
  rabbitmq1_data:
  rabbitmq2_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
