
server:
  port: 8081

spring:
  application:
    name: ms-order

  # Configuración de Seguridad con Azure AD
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/6cad67e2-2872-4d7c-9af2-de5251e67986/v2.0
          audiences: b3dd3447-de99-4c5a-9cae-cf347f9aa7c2

  # Configuración de MongoDB
  mongodb:
    uri: mongodb://mongodb:27017/pedidos360_order

  # Kafka: streaming y auditoría
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093}

    
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 30000
        linger.ms: 5
        delivery.timeout.ms: 120000

    consumer:
      group-id: pedidos360-default
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 50

    listener:
      ack-mode: record
      concurrency: 3

    # Kafka Streams
    streams:
      application-id: pedidos360-inventory-streams
      replication-factor: ${KAFKA_REPLICAS:1}
      state-dir: /tmp/kafka-streams
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        commit.interval.ms: 1000

  # RabbitMQ: clúster de 2 nodos
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

# Nombres centralizados de exchanges, colas y routing keys
pedidos360:
  rabbit:
    dlq-logger-enabled: false
    exchanges:
      topic: pedidos360.topic
      direct: pedidos360.direct
      dlx: pedidos360.dlx
    queues:
      notification: order.notification.queue
      notification-dlq: order.notification.dlq
      kitchen: kitchen.ticket.queue
      kitchen-dlq: kitchen.ticket.dlq
    routing-keys:
      order-created: order.created
      notification-pattern: order.*
      kitchen-ticket: kitchen.ticket

# Kafka topics
app:
  kafka:
    replicas: ${KAFKA_REPLICAS:1}
    topics:
      orders-created: pedidos360.orders.created
      orders-created-dlt: pedidos360.orders.created.DLT
      low-stock: pedidos360.inventory.low-stock
      low-stock-dlt: pedidos360.inventory.low-stock.DLT
